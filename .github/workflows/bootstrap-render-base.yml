name: Bootstrap Render base service

# One-shot workflow to bring a brand-new or broken Render base service to a
# healthy state without dashboard clicks. Run this manually from the Actions
# tab (or via `gh workflow run bootstrap-render-base.yml`) when:
#
#   - The Render service has no JWT_SECRET yet (deploys failing with the
#     bootstrap guard at backend/src/main.ts:13-19), AND
#   - Render Blueprint is not yet connected (so generateValue isn't doing its
#     job for the existing service).
#
# After Blueprint is connected, this workflow is unnecessary — Blueprint owns
# JWT_SECRET via generateValue: true and only generates when the var is absent,
# so a value set by this workflow survives Blueprint adoption.

on:
  workflow_dispatch:
  # Auto-run on this PR branch so the base service is bootstrapped without
  # requiring a workflow_dispatch (which needs the file to be on main first).
  # Remove this push trigger once this PR is merged to main.
  push:
    branches:
      - claude/implement-ephemeral-envs
    paths:
      - .github/workflows/bootstrap-render-base.yml

permissions:
  contents: read

jobs:
  bootstrap:
    name: Ensure JWT_SECRET and trigger redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Ensure JWT_SECRET is set on Render base service
        id: ensure_secret
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          RENDER_API_BASE='https://api.render.com/v1'

          CURRENT_ENV_VARS="$(curl -fsSL \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "${RENDER_API_BASE}/services/${RENDER_SERVICE_ID}/env-vars")"

          JWT_VALUE="$(echo "${CURRENT_ENV_VARS}" | jq -r \
            '[.[] | select(.envVar.key == "JWT_SECRET") | .envVar.value][0] // empty')"

          if [ -n "${JWT_VALUE}" ] \
             && [ "${JWT_VALUE}" != "change-me-in-production" ] \
             && [ "${JWT_VALUE}" != "change-me-in-production-min-32-chars" ]; then
            echo "JWT_SECRET already set to a non-placeholder value on Render base service; no change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')"

          UPDATED_ENV_VARS="$(echo "${CURRENT_ENV_VARS}" | jq \
            --arg key "JWT_SECRET" \
            --arg val "${JWT_SECRET}" \
            '
              [.[] | {key: .envVar.key, value: .envVar.value}]
              | map(select(.key != $key))
              + [{key: $key, value: $val}]
            ')"

          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "${UPDATED_ENV_VARS}" \
            "${RENDER_API_BASE}/services/${RENDER_SERVICE_ID}/env-vars" > /dev/null

          echo "Generated and set JWT_SECRET on Render base service."
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger fresh deploy
        if: steps.ensure_secret.outputs.changed == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" > /dev/null
          echo "Triggered fresh deploy on Render base service."

      - name: Resolve base service URL
        id: url
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          URL=$(curl -fsSL -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" | jq -r '.serviceDetails.url // empty')
          if [ -z "${URL}" ]; then
            echo "Could not resolve base service URL."
            exit 1
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Base service URL: ${URL}"

      - name: Wait for base service /v1/health
        env:
          BASE_URL: ${{ steps.url.outputs.url }}
          HEALTH_MAX_ATTEMPTS: "30"
          HEALTH_RETRY_DELAY_SECONDS: "10"
        run: |
          set -euo pipefail
          HEALTH_FILE="$(mktemp)"
          trap 'rm -f "${HEALTH_FILE}"' EXIT

          for attempt in $(seq 1 "${HEALTH_MAX_ATTEMPTS}"); do
            STATUS=$(curl -sS -o "${HEALTH_FILE}" -w "%{http_code}" "${BASE_URL}/v1/health" || true)
            if [ "${STATUS}" = "200" ]; then
              echo "Base service is healthy."
              cat "${HEALTH_FILE}"
              echo
              exit 0
            fi
            echo "Base service not ready yet (attempt ${attempt}/${HEALTH_MAX_ATTEMPTS}, status=${STATUS}). Retrying..."
            sleep "${HEALTH_RETRY_DELAY_SECONDS}"
          done

          echo "::error::Base service did not become healthy in time."
          echo "Check Render dashboard deploy logs for ${BASE_URL}."
          exit 1

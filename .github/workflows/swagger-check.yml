name: Swagger Annotations Check

# Enforces AGENTS.md §7 ("Documentation"): any new NestJS controller must
# carry @ApiTags on the class and @ApiOperation on every HTTP-verb route.
# Backstop for the local .husky/pre-commit hook so PRs from agents that
# don't run husky (Copilot, Codex, web edits) still get caught.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-swagger:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine changed controllers (PR only)
        id: changed
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          changed=$(git diff --name-only --diff-filter=ACM "origin/${{ github.base_ref }}"...HEAD \
            | grep -E 'backend/src/.*\.controller\.ts$' || true)
          {
            echo 'files<<EOF'
            echo "$changed"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Scan changed controllers
        if: github.event_name == 'pull_request' && steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          # Use xargs so a multi-file list (one path per line) is passed correctly
          # as separate arguments rather than being word-split from an interpolated
          # expression, which would execute subsequent paths as shell commands.
          # -d '\n' treats only newlines as delimiters (safe for paths with spaces).
          # --no-run-if-empty skips invocation when the list is empty.
          echo "$CHANGED_FILES" | xargs -d '\n' --no-run-if-empty node backend/scripts/check-swagger.js

      - name: Scan all controllers (push to main)
        if: github.event_name == 'push'
        run: CHECK_SWAGGER_VERBOSE=1 node backend/scripts/check-swagger.js

      - name: Comment on PR if check failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- swagger-check-policy -->';
            const body = `${marker}
            ## Swagger annotations missing

            One or more changed NestJS controllers lack OpenAPI decorators (\`@ApiTags\` on the class, \`@ApiOperation\` on each route).

            AGENTS.md §7 requires API docs to be updated whenever an endpoint changes. The Swagger annotations are how this repo's \`/api/docs\` stays in sync — see \`backend/src/storage/storage.controller.ts\` for the canonical pattern.

            Reproduce locally:

            \`\`\`bash
            pnpm --filter @agent/backend check:swagger
            \`\`\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

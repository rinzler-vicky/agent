name: PR Preview Environment

# Render service shape is declared in render.yaml at repo root via Render's
# Blueprint feature. This workflow handles the pieces Blueprint cannot own:
#   - Provisioning a per-PR Neon database branch and wiring its connection
#     string into the Render backend preview.
#   - Phase 2.5b: paths-filter-gated wiring of the n8n preview stack (n8n
#     main + worker + keyvalue) declared in render.yaml. When the PR doesn't
#     touch workflow/migration paths, the auto-spawned n8n preview services
#     are DELETEd so the cost is only paid when needed.
#   - Recording the resulting preview environment in the `preview_environments`
#     table (migration 014) so backend services can correlate runs with the
#     preview that hosted them.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  build-and-deploy:
    name: Provision Neon branch and wire Render preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event.pull_request.draft == false && github.event.action != 'closed'
    outputs:
      n8n_needed: ${{ steps.filter.outputs.n8n }}
      preview_url: ${{ steps.preview.outputs.url }}
      n8n_url: ${{ steps.n8n.outputs.url }}
      neon_db_url: ${{ steps.neon.outputs.db_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Phase 2.5b — gate n8n provisioning on workflow/migration path changes.
      # `dorny/paths-filter@v3` works on pull_request triggers out of the box
      # (verified against the action's README, May 2026).
      - name: Detect workflow/migration changes (paths-filter)
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            n8n:
              - 'backend/db/migrations/**'
              - 'backend/src/workflows/**'
              - 'infra/docker-compose.n8n.yml'
              - 'render.yaml'

      - name: Apply render-preview label (PR tracking; previews auto-created by Render Blueprint)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label render-preview

      - name: Compute Neon branch expiration (14 days)
        id: neon_expiry
        run: echo "expires_at=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          expires_at: ${{ steps.neon_expiry.outputs.expires_at }}

      - name: Post Neon schema diff comment
        uses: neondatabase/schema-diff-action@v1
        continue-on-error: true
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          compare_branch: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Wait for Render preview service and set DATABASE_URL
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          NEON_DB_URL: ${{ steps.neon.outputs.db_url }}
          DISCOVER_MAX_ATTEMPTS: "18"
          DISCOVER_RETRY_DELAY_SECONDS: "10"
        run: |
          set -euo pipefail
          RENDER_API_BASE='https://api.render.com/v1'

          if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: ${PR_NUMBER}"
            exit 1
          fi
          if [ -z "${PR_BRANCH}" ]; then
            echo "PR branch is empty."
            exit 1
          fi
          if [ -z "${NEON_DB_URL}" ]; then
            echo "Neon DB URL is empty — create-branch-action did not return db_url."
            exit 1
          fi

          render_get() {
            curl -fsSL -H "Authorization: Bearer ${RENDER_API_KEY}" "${RENDER_API_BASE}$1"
          }

          BASE_SERVICE="$(render_get "/services/${RENDER_SERVICE_ID}")"
          OWNER_ID=$(echo "${BASE_SERVICE}" | jq -r '.ownerId')

          PREVIEW_ID=''
          PREVIEW_URL=''
          for attempt in $(seq 1 "${DISCOVER_MAX_ATTEMPTS}"); do
            SERVICES="$(render_get "/services?ownerId=${OWNER_ID}&includePreviews=true&limit=100")"

            PREVIEW_ID=$(echo "${SERVICES}" | jq -r \
              --arg parent "${RENDER_SERVICE_ID}" \
              --arg branch "${PR_BRANCH}" \
              --arg prNameSuffix "-pr-${PR_NUMBER}" \
              '[.[] | .service // .
                | select((.serviceDetails.parentServer.id // "") == $parent)
                | select(((.branch // "") == $branch) or ((.name // "" | ascii_downcase) | endswith($prNameSuffix)))
                | .id // empty
              ] | first // empty')

            if [ -n "${PREVIEW_ID}" ]; then
              break
            fi
            echo "Render preview service not yet visible (attempt ${attempt}/${DISCOVER_MAX_ATTEMPTS}). Retrying..."
            sleep "${DISCOVER_RETRY_DELAY_SECONDS}"
          done

          if [ -z "${PREVIEW_ID}" ]; then
            WAIT_MINUTES=$(( DISCOVER_MAX_ATTEMPTS * DISCOVER_RETRY_DELAY_SECONDS / 60 ))
            echo "::error::No Render preview service found for PR #${PR_NUMBER} after ${WAIT_MINUTES} min."
            echo ""
            echo "Most likely cause: Render Blueprint is not connected to this repo,"
            echo "so no preview service is being auto-created when PRs open."
            echo ""
            echo "Fix:"
            echo "  1. In Render dashboard: New > Blueprint > select this repository."
            echo "  2. Render reads render.yaml; the service name 'agent' matches the existing"
            echo "     service so Blueprint adopts it. Provide values for the prompted"
            echo "     sync:false env vars when asked."
            echo "  3. After Blueprint is connected, re-run this workflow."
            echo ""
            echo "Full setup runbook: docs/PR_PREVIEWS.md §First-time setup"
            exit 1
          fi

          echo "Resolved Render preview service: ${PREVIEW_ID}"

          CURRENT_ENV_VARS="$(render_get "/services/${PREVIEW_ID}/env-vars")"
          CURRENT_DB_URL="$(echo "${CURRENT_ENV_VARS}" | jq -r '[.[] | select(.envVar.key == "DATABASE_URL") | .envVar.value][0] // empty')"
          CURRENT_JWT="$(echo "${CURRENT_ENV_VARS}" | jq -r '[.[] | select(.envVar.key == "JWT_SECRET") | .envVar.value][0] // empty')"

          # Decide the desired JWT_SECRET. Keep existing if it's already a real value.
          # If empty or a known placeholder, generate one here. Once Blueprint is
          # connected with generateValue:true, Render will generate it for new
          # previews and this branch becomes a no-op for them.
          DESIRED_JWT="${CURRENT_JWT}"
          JWT_CHANGED=false
          if [ -z "${CURRENT_JWT}" ] \
             || [ "${CURRENT_JWT}" = "change-me-in-production" ] \
             || [ "${CURRENT_JWT}" = "change-me-in-production-min-32-chars" ]; then
            DESIRED_JWT="$(openssl rand -base64 48 | tr -d '\n')"
            JWT_CHANGED=true
          fi

          DB_CHANGED=false
          if [ "${CURRENT_DB_URL}" != "${NEON_DB_URL}" ]; then
            DB_CHANGED=true
          fi

          if [ "${DB_CHANGED}" = "false" ] && [ "${JWT_CHANGED}" = "false" ]; then
            echo "Preview env vars already match desired state; no PUT or redeploy needed."
          else
            # Build the full env-vars list: preserve everything else, override
            # DATABASE_URL and JWT_SECRET. PUT replaces all, so we must include
            # every existing var.
            UPDATED_ENV_VARS="$(echo "${CURRENT_ENV_VARS}" | jq \
              --arg dbVal "${NEON_DB_URL}" \
              --arg jwtVal "${DESIRED_JWT}" \
              '
                [.[] | {key: .envVar.key, value: .envVar.value}]
                | map(select(.key != "DATABASE_URL" and .key != "JWT_SECRET"))
                + [{key: "DATABASE_URL", value: $dbVal}, {key: "JWT_SECRET", value: $jwtVal}]
              ')"

            curl -fsSL -X PUT \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              --data "${UPDATED_ENV_VARS}" \
              "${RENDER_API_BASE}/services/${PREVIEW_ID}/env-vars" > /dev/null

            echo "PUT env vars on Render preview service ${PREVIEW_ID}:"
            [ "${DB_CHANGED}" = "true" ] && echo "  - DATABASE_URL updated to Neon branch URL"
            [ "${JWT_CHANGED}" = "true" ] && echo "  - JWT_SECRET generated (previous was empty/placeholder)"

            curl -fsSL -X POST \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              --data '{"clearCache":"do_not_clear"}' \
              "${RENDER_API_BASE}/services/${PREVIEW_ID}/deploys" > /dev/null

            echo "Triggered fresh deploy on Render preview service after env-var update."
          fi

          PREVIEW_URL=$(render_get "/services/${PREVIEW_ID}" | jq -r '.serviceDetails.url // empty')
          if [ -z "${PREVIEW_URL}" ]; then
            echo "Preview service has no URL yet; will resolve in the readiness step."
          fi

          echo "preview_id=${PREVIEW_ID}" >> "$GITHUB_OUTPUT"
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "owner_id=${OWNER_ID}" >> "$GITHUB_OUTPUT"

      - name: Resolve preview URL if not yet known
        id: preview
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PREVIEW_ID: ${{ steps.render.outputs.preview_id }}
          PREVIEW_URL_KNOWN: ${{ steps.render.outputs.preview_url }}
          RESOLVE_URL_MAX_ATTEMPTS: "30"
          RESOLVE_URL_RETRY_DELAY_SECONDS: "10"
        run: |
          set -euo pipefail
          RENDER_API_BASE='https://api.render.com/v1'

          PREVIEW_URL="${PREVIEW_URL_KNOWN}"
          if [ -z "${PREVIEW_URL}" ]; then
            for attempt in $(seq 1 "${RESOLVE_URL_MAX_ATTEMPTS}"); do
              PREVIEW_URL=$(curl -fsSL -H "Authorization: Bearer ${RENDER_API_KEY}" \
                "${RENDER_API_BASE}/services/${PREVIEW_ID}" | jq -r '.serviceDetails.url // empty')
              if [ -n "${PREVIEW_URL}" ]; then
                break
              fi
              echo "Preview URL not yet available (attempt ${attempt}/${RESOLVE_URL_MAX_ATTEMPTS}). Retrying..."
              sleep "${RESOLVE_URL_RETRY_DELAY_SECONDS}"
            done
          fi

          if [ -z "${PREVIEW_URL}" ]; then
            echo "Unable to resolve Render preview URL."
            exit 1
          fi

          echo "url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "Preview URL: ${PREVIEW_URL}"

      - name: Wait for preview API readiness
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          API_READY_MAX_ATTEMPTS: "30"
          API_READY_RETRY_DELAY_SECONDS: "10"
        run: |
          set -euo pipefail
          HEALTH_FILE="$(mktemp)"
          trap 'rm -f "${HEALTH_FILE}"' EXIT

          if [[ "${PREVIEW_URL}" != https://* ]]; then
            echo "Resolved preview URL must use HTTPS: ${PREVIEW_URL}"
            exit 1
          fi

          PREVIEW_HOST="${PREVIEW_URL#https://}"
          PREVIEW_HOST="${PREVIEW_HOST%%/*}"
          if [[ "${PREVIEW_HOST}" != *.onrender.com ]]; then
            echo "Resolved preview URL is not a Render URL: ${PREVIEW_URL}"
            exit 1
          fi

          for attempt in $(seq 1 "${API_READY_MAX_ATTEMPTS}"); do
            STATUS=$(curl -sS -o "${HEALTH_FILE}" -w "%{http_code}" "${PREVIEW_URL}/v1/health" || true)
            if [ "${STATUS}" = "200" ]; then
              echo "Preview API is ready."
              cat "${HEALTH_FILE}"
              echo
              exit 0
            fi
            echo "Preview API not ready yet (attempt ${attempt}/${API_READY_MAX_ATTEMPTS}, status=${STATUS}). Retrying..."
            sleep "${API_READY_RETRY_DELAY_SECONDS}"
          done

          echo "Preview API did not become ready in time."
          exit 1

      # ─────────────────────────────────────────────────────────────────────
      # Phase 2.5b — n8n preview stack handling
      # ─────────────────────────────────────────────────────────────────────
      # When paths-filter matches: wire the auto-spawned n8n services to the
      # per-PR Neon branch + post the n8n URL.
      # When paths-filter does NOT match: delete the auto-spawned n8n services
      # to avoid paying for compute we won't use. Render auto-spawned them via
      # render.yaml's `previews.generation: automatic` — we tear them down via
      # `DELETE /v1/services/{id}` (verified endpoint).
      #
      # Service discovery follows the same parent-id + name-suffix match used
      # for the backend service. The four service names we look for are
      # single n8n service is declared in render.yaml as `agent-n8n`
      # (single-process mode; no worker, no Redis — see render.yaml comments).

      - name: Discover n8n preview service
        id: n8n_discover
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          OWNER_ID: ${{ steps.render.outputs.owner_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          RENDER_API_BASE='https://api.render.com/v1'
          SERVICES="$(curl -fsSL -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "${RENDER_API_BASE}/services?ownerId=${OWNER_ID}&includePreviews=true&limit=200")"

          N8N_ID=$(echo "${SERVICES}" | jq -r \
            --arg branch "${PR_BRANCH}" \
            --arg prSuffix "-pr-${PR_NUMBER}" \
            '[.[] | .service // .
              | select((.name // "" | ascii_downcase) | startswith("agent-n8n"))
              | select(((.branch // "") == $branch) or ((.name // "" | ascii_downcase) | endswith($prSuffix)))
              | .id // empty
            ] | first // empty')

          echo "n8n_id=${N8N_ID}" >> "$GITHUB_OUTPUT"

          if [ -n "${N8N_ID}" ]; then
            echo "Discovered n8n preview service: ${N8N_ID}"
          else
            echo "No n8n preview service found yet (Blueprint may still be provisioning, or service not declared)."
          fi

      - name: Tear down n8n preview when paths-filter is false
        if: steps.filter.outputs.n8n != 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          N8N_ID: ${{ steps.n8n_discover.outputs.n8n_id }}
        run: |
          set -euo pipefail
          [ -z "${N8N_ID}" ] && exit 0
          echo "Deleting n8n preview service ${N8N_ID} (PR doesn't touch workflow/migration paths)"
          curl -fsSL -X DELETE \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${N8N_ID}" || \
            echo "::warning::DELETE failed for ${N8N_ID}; Render may still tear down on PR close"

      - name: Wire n8n preview service to Neon branch
        id: n8n
        if: steps.filter.outputs.n8n == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          N8N_ID: ${{ steps.n8n_discover.outputs.n8n_id }}
          NEON_DB_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          set -euo pipefail
          RENDER_API_BASE='https://api.render.com/v1'

          if [ -z "${N8N_ID}" ]; then
            echo "::error::n8n preview service not found; Blueprint may not include the agent-n8n service."
            echo "Add the agent-n8n service to render.yaml and reconnect Blueprint."
            exit 1
          fi

          # Parse Neon URL → host/port/database/user/password.
          # Expected format: postgres://USER:PASS@HOST:PORT/DB?...
          NO_SCHEME="${NEON_DB_URL#postgres://}"
          NO_SCHEME="${NO_SCHEME#postgresql://}"
          USERPASS="${NO_SCHEME%%@*}"
          HOSTPORTDB="${NO_SCHEME#*@}"
          DB_USER="${USERPASS%%:*}"
          DB_PASS="${USERPASS#*:}"
          HOSTPORT="${HOSTPORTDB%%/*}"
          DB_HOST="${HOSTPORT%%:*}"
          DB_PORT="${HOSTPORT#*:}"
          [ "${DB_PORT}" = "${HOSTPORT}" ] && DB_PORT=5432
          DB_NAME_QS="${HOSTPORTDB#*/}"
          DB_NAME="${DB_NAME_QS%%\?*}"

          # Render PUT replaces the full env-var set per service — fetch first,
          # override the DB_POSTGRESDB_* keys, PUT the merged list.
          CURRENT="$(curl -fsSL -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "${RENDER_API_BASE}/services/${N8N_ID}/env-vars")"
          UPDATED="$(echo "${CURRENT}" | jq \
            --arg host "${DB_HOST}" \
            --arg port "${DB_PORT}" \
            --arg db "${DB_NAME}" \
            --arg user "${DB_USER}" \
            --arg pass "${DB_PASS}" \
            '
              [.[] | {key: .envVar.key, value: .envVar.value}]
              | map(select(.key | test("^DB_POSTGRESDB_(HOST|PORT|DATABASE|USER|PASSWORD)$") | not))
              + [
                  {key: "DB_POSTGRESDB_HOST", value: $host},
                  {key: "DB_POSTGRESDB_PORT", value: $port},
                  {key: "DB_POSTGRESDB_DATABASE", value: $db},
                  {key: "DB_POSTGRESDB_USER", value: $user},
                  {key: "DB_POSTGRESDB_PASSWORD", value: $pass}
                ]
            ')"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "${UPDATED}" \
            "${RENDER_API_BASE}/services/${N8N_ID}/env-vars" > /dev/null
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}' \
            "${RENDER_API_BASE}/services/${N8N_ID}/deploys" > /dev/null

          # Ensure the n8n schema exists on the per-PR Neon branch before
          # n8n boots. n8n's TypeORM migrations will auto-create tables under
          # `n8n` schema. Idempotent — safe to re-run on workflow retry.
          psql "${NEON_DB_URL}" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS n8n;"

          # Resolve n8n URL.
          N8N_URL=""
          for attempt in $(seq 1 30); do
            N8N_URL=$(curl -fsSL -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "${RENDER_API_BASE}/services/${N8N_ID}" | jq -r '.serviceDetails.url // empty')
            [ -n "${N8N_URL}" ] && break
            echo "n8n URL not yet resolved (attempt ${attempt}/30)..."
            sleep 10
          done

          echo "url=${N8N_URL}" >> "$GITHUB_OUTPUT"
          echo "n8n preview URL: ${N8N_URL}"

      - name: Record preview environment in DB
        env:
          NEON_DB_URL: ${{ steps.neon.outputs.db_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BACKEND_SERVICE_ID: ${{ steps.render.outputs.preview_id }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          N8N_ID: ${{ steps.n8n_discover.outputs.n8n_id }}
          N8N_URL: ${{ steps.n8n.outputs.url }}
          NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}
          NEON_EXPIRES_AT: ${{ steps.neon_expiry.outputs.expires_at }}
          N8N_NEEDED: ${{ steps.filter.outputs.n8n }}
          TENANT_ID: ${{ vars.PR_PREVIEW_TENANT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TENANT_ID:-}" ]; then
            echo "::warning::PR_PREVIEW_TENANT_ID variable not set; skipping preview_environments INSERT."
            echo "Set this once via: gh variable set PR_PREVIEW_TENANT_ID --body <uuid-of-the-platform-tenant>"
            exit 0
          fi

          # When paths-filter is false the n8n columns are NULL (rows still
          # carry the backend service id + URL).
          N8N_ID_PARAM='NULL'
          N8N_URL_PARAM='NULL'
          if [ "${N8N_NEEDED}" = "true" ]; then
            [ -n "${N8N_ID}" ]  && N8N_ID_PARAM="'${N8N_ID}'"
            [ -n "${N8N_URL}" ] && N8N_URL_PARAM="'${N8N_URL}'"
          fi

          psql "${NEON_DB_URL}" -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO preview_environments
                (tenant_id, pr_number, source, status,
                 render_backend_service_id, render_n8n_service_id,
                 neon_branch_name, preview_url, n8n_url, expires_at)
              VALUES
                ('${TENANT_ID}'::uuid, ${PR_NUMBER}, 'pr', 'ready',
                 '${BACKEND_SERVICE_ID}', ${N8N_ID_PARAM},
                 '${NEON_BRANCH}', '${PREVIEW_URL}', ${N8N_URL_PARAM},
                 '${NEON_EXPIRES_AT}'::timestamptz);
          SQL

      - name: Create GitHub Deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: `pr-${context.payload.pull_request.number}`,
              description: `Preview environment for PR #${context.payload.pull_request.number}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              environment_url: '${{ steps.preview.outputs.url }}',
              description: 'Preview environment deployed',
            });

      - name: Comment PR with preview URL
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-tag: pr-preview-comment
          edit-mode: replace
          body: |
            ## 🚀 Preview Environment Ready

            **Preview URL:** ${{ steps.preview.outputs.url }}

            - 📚 API Docs: ${{ steps.preview.outputs.url }}/api/docs
            - ❤️ Health: ${{ steps.preview.outputs.url }}/v1/health

            ```bash
            curl ${{ steps.preview.outputs.url }}/v1/health
            ```

            ${{ steps.filter.outputs.n8n == 'true' && format('### 🧩 n8n Preview

            **n8n Editor:** {0}

            > This PR touches workflow or migration code, so a per-PR n8n
            > queue-mode stack (main + worker + keyvalue) was provisioned
            > alongside the backend. Both share the per-PR Neon branch
            > (backend uses public schema; n8n uses `n8n` schema).', steps.n8n.outputs.url) || '' }}

            ### 🗄️ Neon Database Branch

            | | |
            |---|---|
            | Branch | `preview/pr-${{ github.event.pull_request.number }}` |
            | Parent | `production` (copy-on-write clone) |
            | Expires | ${{ steps.neon_expiry.outputs.expires_at }} (safety net; PR close deletes earlier) |
            | Console | https://console.neon.tech/app/projects/${{ vars.NEON_PROJECT_ID }}/branches |

            > Each preview gets a fresh Neon branch (full schema, extensions, and RLS inherited)
            > and a unique `JWT_SECRET` generated by Render Blueprint. Both are cleaned up on PR close.
            > If schema migrations ran on this branch, see the schema-diff comment above.

  # Phase 2.5b — smoke test runs only when n8n stack was provisioned. Hits
  # the backend preview's health endpoint and verifies a preview_environments
  # row was recorded. The smoke test deliberately does NOT exercise the
  # agent-spawner end-to-end (that would require minting a service-account
  # JWT against the preview's regenerated JWT_SECRET — deferred to manual QA).
  smoke-test:
    name: Smoke test PR preview
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: needs.build-and-deploy.outputs.n8n_needed == 'true'
    timeout-minutes: 10

    steps:
      - name: Probe backend health
        env:
          PREVIEW_URL: ${{ needs.build-and-deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/health.json -w "%{http_code}" "${PREVIEW_URL}/v1/health")
          if [ "${STATUS}" != "200" ]; then
            echo "Backend health probe returned ${STATUS}"
            cat /tmp/health.json || true
            exit 1
          fi
          cat /tmp/health.json
          echo

      - name: Verify preview_environments row exists
        env:
          NEON_DB_URL: ${{ needs.build-and-deploy.outputs.neon_db_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          COUNT=$(psql "${NEON_DB_URL}" -tAc \
            "SELECT count(*) FROM preview_environments WHERE pr_number = ${PR_NUMBER} AND source = 'pr';")
          if [ "${COUNT}" -lt "1" ]; then
            echo "::error::No preview_environments row found for PR ${PR_NUMBER}"
            exit 1
          fi
          echo "Found ${COUNT} preview_environments row(s) for PR ${PR_NUMBER}."

  teardown:
    name: Tear down preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'

    steps:
      - name: Mark preview_environments row torn_down
        env:
          # On teardown the Neon branch is being deleted in the next step;
          # use the production DATABASE_URL (set as a repo secret) for the
          # UPDATE so we hit the surviving row rather than the about-to-be-gone branch.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::warning::DATABASE_URL secret not set; skipping preview_environments teardown UPDATE."
            exit 0
          fi
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -c "
            UPDATE preview_environments
               SET status = 'torn_down', torn_down_at = now(), updated_at = now()
             WHERE pr_number = ${PR_NUMBER}
               AND source = 'pr'
               AND status <> 'torn_down';
          "

      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        continue-on-error: true
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: preview/pr-${{ github.event.pull_request.number }}

      - name: Mark GitHub deployment inactive
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const deployments = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: `pr-${context.payload.pull_request.number}`,
            });
            for (const deployment of deployments.data) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: 'inactive',
                description: 'Preview environment torn down',
              });
            }

      - name: Delete environment
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              await github.rest.repos.deleteAnEnvironment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: `pr-${context.payload.pull_request.number}`,
              });
            } catch (error) {
              console.log('Environment may not exist or already deleted:', error.message);
            }

      - name: Comment PR teardown
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-tag: pr-preview-comment
          edit-mode: replace
          body: |
            ## 🧹 Preview Environment Torn Down

            - Render preview services (backend, n8n stack if any): deleted by Render (PR closed)
            - Neon branch `preview/pr-${{ github.event.pull_request.number }}`: deleted
            - `preview_environments` row: marked `torn_down`
            - GitHub deployment: marked inactive

            **Reason:** PR was ${{ github.event.pull_request.merged && 'merged' || 'closed' }}.

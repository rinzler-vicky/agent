name: PR Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  packages: write
  deployments: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build and Deploy Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && github.event.action != 'closed'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Ensure Render service build/start commands
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          BACKEND_WORKSPACE: "@agent/backend"
          RENDER_INSTALL_COMMAND: corepack enable && pnpm install --frozen-lockfile
          RENDER_BUILD_SCRIPT: build
          RENDER_START_SCRIPT: start
        run: |
          set -euo pipefail

          RENDER_API_BASE='https://api.render.com/v1'
          BUILD_COMMAND_QUERY='.serviceDetails.envSpecificDetails.buildCommand // .serviceDetails.buildCommand // empty'
          START_COMMAND_QUERY='.serviceDetails.envSpecificDetails.startCommand // .serviceDetails.startCommand // empty'
          RENDER_BUILD_COMMAND="${RENDER_INSTALL_COMMAND} && pnpm --filter ${BACKEND_WORKSPACE} ${RENDER_BUILD_SCRIPT}"
          RENDER_START_COMMAND="pnpm --filter ${BACKEND_WORKSPACE} ${RENDER_START_SCRIPT}"

          SERVICE="$(curl -fsSL -H "Authorization: Bearer ${RENDER_API_KEY}" "${RENDER_API_BASE}/services/${RENDER_SERVICE_ID}")"
          SERVICE_REPO="$(echo "${SERVICE}" | jq -r '.repo // empty')"

          if [ -z "${SERVICE_REPO}" ]; then
            echo "Render service is not Git-backed; skipping build/start command sync."
            exit 0
          fi

          CURRENT_BUILD="$(echo "${SERVICE}" | jq -r "${BUILD_COMMAND_QUERY}")"
          CURRENT_START="$(echo "${SERVICE}" | jq -r "${START_COMMAND_QUERY}")"

          if [ "${CURRENT_BUILD}" = "${RENDER_BUILD_COMMAND}" ] && [ "${CURRENT_START}" = "${RENDER_START_COMMAND}" ]; then
            echo "Render build/start commands already match expected values."
            exit 0
          fi

          PAYLOAD="$(
            jq -n \
              --arg build "${RENDER_BUILD_COMMAND}" \
              --arg start "${RENDER_START_COMMAND}" \
              '{serviceDetails:{envSpecificDetails:{buildCommand:$build,startCommand:$start}}}'
          )"

          PATCH_RESPONSE="$(curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "${PAYLOAD}" \
            "${RENDER_API_BASE}/services/${RENDER_SERVICE_ID}")"

          UPDATED_SERVICE="$(curl -fsSL -H "Authorization: Bearer ${RENDER_API_KEY}" "${RENDER_API_BASE}/services/${RENDER_SERVICE_ID}")"
          UPDATED_BUILD="$(echo "${UPDATED_SERVICE}" | jq -r "${BUILD_COMMAND_QUERY}")"
          UPDATED_START="$(echo "${UPDATED_SERVICE}" | jq -r "${START_COMMAND_QUERY}")"

          if [ "${UPDATED_BUILD}" != "${RENDER_BUILD_COMMAND}" ] || [ "${UPDATED_START}" != "${RENDER_START_COMMAND}" ]; then
            echo "Render build/start command sync verification failed."
            echo "PATCH response:"
            echo "${PATCH_RESPONSE}"
            echo "Expected build command: ${RENDER_BUILD_COMMAND}"
            echo "Actual build command: ${UPDATED_BUILD}"
            echo "Expected start command: ${RENDER_START_COMMAND}"
            echo "Actual start command: ${UPDATED_START}"
            exit 1
          fi

          echo "Updated Render build/start commands for backend workspace."

      - name: Ensure Render manual preview label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map((label) => label.name);
            if (!labels.includes('render-preview')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ['render-preview'],
              });
              core.info('Added render-preview label to trigger Render manual PR preview.');
            } else {
              core.info('render-preview label already exists.');
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve Render Preview URL
        id: preview
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          RESOLVE_URL_MAX_ATTEMPTS: "30"
          RESOLVE_URL_RETRY_DELAY_SECONDS: "10"
        run: |
          set -euo pipefail

          RENDER_API_BASE='https://api.render.com/v1'
          BRANCH="${PR_BRANCH}"
          if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: ${PR_NUMBER}"
            exit 1
          fi
          if [ -z "${BRANCH}" ]; then
            echo "PR branch is empty."
            exit 1
          fi

          render_api_get() {
            local endpoint="$1"
            local label="$2"
            local response=''
            if ! response=$(curl -fsSL -H "Authorization: Bearer ${RENDER_API_KEY}" "${RENDER_API_BASE}${endpoint}"); then
              echo "Render API request failed while fetching ${label} (${endpoint})."
              exit 1
            fi
            echo "${response}"
          }

          BASE_SERVICE="$(render_api_get "/services/${RENDER_SERVICE_ID}" "base service")"

          OWNER_ID=$(echo "${BASE_SERVICE}" | jq -r '.ownerId')
          BASE_URL=$(echo "${BASE_SERVICE}" | jq -r '.serviceDetails.url // empty')
          if [ -z "${BASE_URL}" ]; then
            echo "Base Render service URL is not available from Render API; preview URL must be discovered from preview instances."
          fi

          PREVIEW_URL=''
          for attempt in $(seq 1 "${RESOLVE_URL_MAX_ATTEMPTS}"); do
            SERVICES="$(render_api_get "/services?ownerId=${OWNER_ID}&includePreviews=true&limit=100" "services list")"

            PREVIEW_URL=$(echo "${SERVICES}" | jq -r \
              --arg parent "${RENDER_SERVICE_ID}" \
              --arg branch "${BRANCH}" \
              '[.[] |
                select((.serviceDetails.parentServer.id // "") == $parent) |
                select((.branch // "") == $branch) |
                .serviceDetails.url // empty
              ] | first // empty')

            if [ -z "${PREVIEW_URL}" ]; then
              PREVIEW_URL=$(echo "${SERVICES}" | jq -r \
                --arg parent "${RENDER_SERVICE_ID}" \
                --arg prNameSuffix "-pr-${PR_NUMBER}" \
                '[.[] |
                  select((.serviceDetails.parentServer.id // "") == $parent) |
                  select(((.name // "") | ascii_downcase | endswith($prNameSuffix))) |
                  .serviceDetails.url // empty
                ] | first // empty')
            fi

            if [ -n "${PREVIEW_URL}" ]; then
              break
            fi

            echo "Preview URL not available yet (attempt ${attempt}/${RESOLVE_URL_MAX_ATTEMPTS}). Retrying..."
            sleep "${RESOLVE_URL_RETRY_DELAY_SECONDS}"
          done

          if [ -z "${PREVIEW_URL}" ]; then
            if [ -n "${BASE_URL}" ]; then
              PREVIEW_URL="${BASE_URL}"
              echo "Falling back to base Render service URL: ${PREVIEW_URL}"
            else
              echo "Unable to resolve a Render preview URL and no base URL is available."
              exit 1
            fi
          fi

          echo "url=${PREVIEW_URL}" >> $GITHUB_OUTPUT
          echo "Preview URL: ${PREVIEW_URL}"

      - name: Wait for Preview API readiness
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          API_READY_MAX_ATTEMPTS: "24"
          API_READY_RETRY_DELAY_SECONDS: "10"
        run: |
          set -euo pipefail
          HEALTH_FILE="$(mktemp)"
          trap 'rm -f "${HEALTH_FILE}"' EXIT

          if [[ "${PREVIEW_URL}" != https://* ]]; then
            echo "Resolved preview URL must use HTTPS: ${PREVIEW_URL}"
            exit 1
          fi

          PREVIEW_HOST="${PREVIEW_URL#https://}"
          PREVIEW_HOST="${PREVIEW_HOST%%/*}"
          if [[ "${PREVIEW_HOST}" != *.onrender.com ]]; then
            echo "Resolved preview URL is not a valid onrender.com URL: ${PREVIEW_URL}"
            exit 1
          fi

          for attempt in $(seq 1 "${API_READY_MAX_ATTEMPTS}"); do
            CURL_EXIT=0
            STATUS=$(curl -sS -o "${HEALTH_FILE}" -w "%{http_code}" "${PREVIEW_URL}/v1/health") || CURL_EXIT=$?
            if [ "${CURL_EXIT}" -ne 0 ]; then
              echo "Health check request failed (attempt ${attempt}/${API_READY_MAX_ATTEMPTS}, curl_exit=${CURL_EXIT}). Retrying..."
              sleep "${API_READY_RETRY_DELAY_SECONDS}"
              continue
            fi

            if [ "${STATUS}" = "200" ]; then
              echo "Preview API is ready."
              cat "${HEALTH_FILE}"
              exit 0
            fi

            echo "Preview API not ready yet (attempt ${attempt}/${API_READY_MAX_ATTEMPTS}, status=${STATUS}). Retrying..."
            sleep "${API_READY_RETRY_DELAY_SECONDS}"
          done

          echo "Preview API did not become ready in time."
          exit 1

      - name: Create GitHub Deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: `pr-${context.payload.pull_request.number}`,
              description: `Preview environment for PR #${context.payload.pull_request.number}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              environment_url: '${{ steps.preview.outputs.url }}',
              description: 'Preview environment deployed'
            });

            return deployment.data.id;

      - name: Comment PR with Preview URL
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🚀 Preview Environment Deployed

            Your changes have been deployed to Render!

            **Preview URL:** ${{ steps.preview.outputs.url }}
            **Docker Image:** `${{ steps.meta.outputs.tags }}`
            **PR Number:** #${{ github.event.pull_request.number }}

            ### Quick Links
            - 📚 [API Documentation](${{ steps.preview.outputs.url }}/api/docs)
            - ❤️ [Health Check](${{ steps.preview.outputs.url }}/v1/health)

            ### Testing this Preview
            ```bash
            # Health check
            curl ${{ steps.preview.outputs.url }}/v1/health

            # View API docs
            open ${{ steps.preview.outputs.url }}/api/docs
            ```

            > **Note:** Render manual PR preview mode is enabled.
            > The `render-preview` label is automatically applied to keep preview provisioning consistent.
            >
            > Docker image is available at: `${{ steps.meta.outputs.tags }}`
          comment-tag: pr-preview-comment

  teardown:
    name: Teardown Preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'

    steps:
      - name: Set Environment to Inactive
        uses: actions/github-script@v7
        with:
          script: |
            const deployments = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: `pr-${context.payload.pull_request.number}`
            });

            for (const deployment of deployments.data) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: 'inactive',
                description: 'Preview environment torn down'
              });
            }

      - name: Delete Environment
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              await github.rest.repos.deleteAnEnvironment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: `pr-${context.payload.pull_request.number}`
              });
            } catch (error) {
              console.log('Environment may not exist or already deleted:', error.message);
            }

      - name: Comment PR Teardown
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🧹 Preview Environment Torn Down

            The preview environment for this PR has been automatically cleaned up.

            **Status:** Inactive
            **Reason:** PR was ${{ github.event.pull_request.merged && 'merged' || 'closed' }}
          comment-tag: pr-preview-comment

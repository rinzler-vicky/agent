name: PR Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  packages: write
  deployments: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build and Deploy Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && github.event.action != 'closed'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Ensure Render manual preview label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map((label) => label.name);
            if (!labels.includes('render-preview')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ['render-preview'],
              });
              core.info('Added render-preview label to trigger Render manual PR preview.');
            } else {
              core.info('render-preview label already exists.');
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve Render Preview URL
        id: preview
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          PR_NUMBER='${{ github.event.pull_request.number }}'
          BRANCH='${{ github.event.pull_request.head.ref }}'
          RENDER_API_BASE='https://api.render.com/v1'

          BASE_SERVICE=$(curl -fsSL \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "${RENDER_API_BASE}/services/${RENDER_SERVICE_ID}")

          OWNER_ID=$(echo "${BASE_SERVICE}" | jq -r '.ownerId')
          BASE_URL=$(echo "${BASE_SERVICE}" | jq -r '.serviceDetails.url // empty')

          PREVIEW_URL=''
          for attempt in $(seq 1 30); do
            SERVICES=$(curl -fsSL \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "${RENDER_API_BASE}/services?ownerId=${OWNER_ID}&includePreviews=true&limit=100")

            PREVIEW_URL=$(echo "${SERVICES}" | jq -r \
              --arg parent "${RENDER_SERVICE_ID}" \
              --arg branch "${BRANCH}" \
              --arg pr "pr-${PR_NUMBER}" \
              '[.[] |
                select((.serviceDetails.parentServer.id // "") == $parent) |
                select((.branch // "") == $branch or ((.name // "") | test($pr; "i"))) |
                .serviceDetails.url // empty
              ] | first // empty')

            if [ -n "${PREVIEW_URL}" ]; then
              break
            fi

            echo "Preview URL not available yet (attempt ${attempt}/30). Retrying..."
            sleep 10
          done

          if [ -z "${PREVIEW_URL}" ]; then
            PREVIEW_URL="${BASE_URL}"
            echo "Falling back to base Render service URL: ${PREVIEW_URL}"
          fi

          if [ -z "${PREVIEW_URL}" ]; then
            echo "Unable to resolve a Render preview URL."
            exit 1
          fi

          echo "url=${PREVIEW_URL}" >> $GITHUB_OUTPUT
          echo "Preview URL: ${PREVIEW_URL}"

      - name: Wait for Preview API readiness
        run: |
          set -euo pipefail
          PREVIEW_URL='${{ steps.preview.outputs.url }}'

          for attempt in $(seq 1 24); do
            STATUS=$(curl -sS -o /tmp/preview-health.json -w "%{http_code}" "${PREVIEW_URL}/v1/health" || true)
            if [ "${STATUS}" = "200" ]; then
              echo "Preview API is ready."
              cat /tmp/preview-health.json
              exit 0
            fi

            echo "Preview API not ready yet (attempt ${attempt}/24, status=${STATUS}). Retrying..."
            sleep 10
          done

          echo "Preview API did not become ready in time."
          exit 1

      - name: Create GitHub Deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: `pr-${context.payload.pull_request.number}`,
              description: `Preview environment for PR #${context.payload.pull_request.number}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              environment_url: '${{ steps.preview.outputs.url }}',
              description: 'Preview environment deployed'
            });

            return deployment.data.id;

      - name: Comment PR with Preview URL
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🚀 Preview Environment Deployed

            Your changes have been deployed to Render!

            **Preview URL:** ${{ steps.preview.outputs.url }}
            **Docker Image:** `${{ steps.meta.outputs.tags }}`
            **PR Number:** #${{ github.event.pull_request.number }}

            ### Quick Links
            - 📚 [API Documentation](${{ steps.preview.outputs.url }}/api/docs)
            - ❤️ [Health Check](${{ steps.preview.outputs.url }}/v1/health)

            ### Testing this Preview
            ```bash
            # Health check
            curl ${{ steps.preview.outputs.url }}/v1/health

            # View API docs
            open ${{ steps.preview.outputs.url }}/api/docs
            ```

            > **Note:** Render manual PR preview mode is enabled.
            > The `render-preview` label is automatically applied to keep preview provisioning consistent.
            >
            > Docker image is available at: `${{ steps.meta.outputs.tags }}`
          comment-tag: pr-preview-comment

  teardown:
    name: Teardown Preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'

    steps:
      - name: Set Environment to Inactive
        uses: actions/github-script@v7
        with:
          script: |
            const deployments = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: `pr-${context.payload.pull_request.number}`
            });

            for (const deployment of deployments.data) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: 'inactive',
                description: 'Preview environment torn down'
              });
            }

      - name: Delete Environment
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              await github.rest.repos.deleteAnEnvironment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: `pr-${context.payload.pull_request.number}`
              });
            } catch (error) {
              console.log('Environment may not exist or already deleted:', error.message);
            }

      - name: Comment PR Teardown
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🧹 Preview Environment Torn Down

            The preview environment for this PR has been automatically cleaned up.

            **Status:** Inactive
            **Reason:** PR was ${{ github.event.pull_request.merged && 'merged' || 'closed' }}
          comment-tag: pr-preview-comment

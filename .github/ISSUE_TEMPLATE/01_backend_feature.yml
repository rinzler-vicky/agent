name: "01 — Backend Feature Phase"
description: "Backend/API/data/workflow phase issue."
title: "[Backend][Phase N]: "
labels: ["type:backend", "status:planned", "phase"]
body:
  - type: input
    id: parent
    attributes:
      label: Parent master goal
      placeholder: "#123"
    validations:
      required: true
  - type: textarea
    id: phase_goal
    attributes:
      label: Phase goal
      description: What this backend phase must accomplish.
    validations:
      required: true
  - type: textarea
    id: problem_statement
    attributes:
      label: Problem statement
      description: What user, developer, or operational need does this phase address? Why is it being done now?
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Explicit out-of-scope items. Helps the implementer avoid scope creep and signals what is deferred to later phases.
      placeholder: "- Item not in scope for this phase\n- Another deferred item"
    validations:
      required: true
  - type: textarea
    id: hard_prerequisites
    attributes:
      label: Hard prerequisites (block-on)
      description: Gates that must be closed before any implementation PR for this phase may merge. Reference prior phases, ADRs, infrastructure provisioning, etc.
      placeholder: "- [ ] ADR-XXXX Status: Accepted\n- [ ] Phase N closed\n- [ ] Infrastructure provisioned"
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Approved architecture / ADR link
      description: Link the ADR file path (e.g., `docs/adr/ADR-0002-...md`). The ADR must be `Status: Accepted` before any implementation PR for this phase merges.
      placeholder: "docs/adr/ADR-0002-... — Status: Accepted | Proposed | N/A with reason"
    validations:
      required: true
  - type: textarea
    id: reuse_pointers
    attributes:
      label: Reuse pointers
      description: File paths of existing utilities, services, schema patterns, or modules that this work must reuse rather than reimplement. Pulled from current repo observations during planning.
      placeholder: "- `backend/src/database/...` — shared pg pool\n- `backend/src/...` — describe reuse"
    validations:
      required: true
  - type: textarea
    id: rollback_plan
    attributes:
      label: Rollback plan
      description: How is this phase rolled back if it must be reverted? Feature flag, paired migration-down per PR, PITR window, etc.
      placeholder: "- Feature flag: describe flag name and removal plan\n- Migrations: each PR ships its own down step\n- DB recovery window: describe PITR or snapshot strategy"
    validations:
      required: true
  - type: textarea
    id: self_modification_surface
    attributes:
      label: Self-modification surface (optional)
      description: For phases that touch the governed-mutation model (ARCHITECTURE.md §3), which mutation Class (A/B/C/D) does this work enable or constrain? Leave blank if not applicable.
      placeholder: "e.g., Phase 2 ships the Class C mechanism (agent-authored drafts); Phase 5 layers Class D approval policy."
    validations:
      required: false
  - type: textarea
    id: surfaces
    attributes:
      label: Affected backend surfaces
      value: |
        APIs/routes:
        - 
        Services/domain modules:
        - 
        Database/migrations:
        - 
        Workflows/jobs/queues:
        - 
        External integrations/adapters:
        - 
        Observability/security/config:
        - 
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks and subtasks
      value: |
        - [ ] Task 1
          - [ ] Subtask
        - [ ] Task 2
          - [ ] Subtask
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] API contract is documented and tested.
        - [ ] Inputs are validated and errors are deterministic.
        - [ ] Database migrations are reversible or have a rollback note.
        - [ ] Workflow/job behavior is idempotent and retry-safe where applicable.
        - [ ] Security and permission behavior is covered.
    validations:
      required: true
  - type: textarea
    id: qa
    attributes:
      label: QA and validation plan
      value: |
        Required checks:
        - [ ] Unit tests
        - [ ] Integration tests
        - [ ] API contract tests
        - [ ] Migration up/down or rollback verification
        - [ ] Lint/typecheck/format
        - [ ] Build
        Manual QA:
        - 
    validations:
      required: true
  - type: textarea
    id: learnings
    attributes:
      label: Learnings / trial and error log
      description: Agents must update this as work proceeds.
      value: |
        - Attempt:
          Result:
          Learning:
    validations:
      required: false
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Filled at phase completion.
      value: |
        Completed:
        Deferred:
        Follow-up issues:
        Rollback notes:
    validations:
      required: false

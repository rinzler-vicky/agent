version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-postgres-preview
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agent-backend-preview
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent_dev_password}@postgres:5432/${POSTGRES_DB:-agent_db}
      DATABASE_SSL: "false"
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:-preview-jwt-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-agent-artifacts}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      N8N_API_URL: ${N8N_API_URL:-http://n8n-main:5678/api/v1}
      N8N_API_KEY: ${N8N_API_KEY}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_WEBHOOK_BASE_URL: ${N8N_WEBHOOK_BASE_URL:-http://backend:3000}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      N8N_WEBHOOK_CLOCK_SKEW_S: ${N8N_WEBHOOK_CLOCK_SKEW_S:-300}
      N8N_RECONCILE_TIMEOUT_MS: ${N8N_RECONCILE_TIMEOUT_MS:-2000}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  agent-network:
    driver: bridge

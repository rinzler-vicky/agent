version: '3.8'

# Run alongside the root docker-compose.yml:
#   docker compose -f docker-compose.yml -f infra/docker-compose.n8n.yml up
#
# Phase 2.3 — issue #43. Brings up n8n self-hosted (Community Edition) in
# queue mode with one worker, sharing the project's Postgres server (separate
# `n8n` database) and a dedicated Redis broker.
#
# Required env (load via .env at repo root):
#   N8N_ENCRYPTION_KEY  — must be identical on n8n-main and n8n-worker
#                         (per n8n docs: encryption key is shared).
#   POSTGRES_USER / POSTGRES_PASSWORD — same vars used by root postgres service.
#   N8N_BASIC_AUTH_USER / N8N_BASIC_AUTH_PASSWORD — protect the editor.

services:
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-network

  postgres-n8n-init:
    image: postgres:16-alpine
    container_name: agent-postgres-n8n-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-agent}
      PGPASSWORD: ${POSTGRES_PASSWORD:-agent_dev_password}
      PGDATABASE: postgres
    volumes:
      # Compose v2 resolves relative paths from the first `-f` file's
      # project directory (the repo root when running the documented
      # command). Use the repo-root-relative path so the bind mount finds
      # the SQL file regardless of which compose-file order is used.
      - ./infra/n8n/init-n8n-db.sql:/init-n8n-db.sql:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/init-n8n-db.sql"]
    restart: "no"
    networks:
      - agent-network

  n8n-main:
    image: docker.n8n.io/n8nio/n8n:1.79.0
    container_name: agent-n8n-main
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-n8n-init:
        condition: service_completed_successfully
    environment:
      # Queue mode + Redis broker (verified against n8n docs:
      # github.com/n8n-io/n8n-docs/docs/hosting/scaling/queue-mode.md)
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-in-production-min-32-chars}
      # Postgres for n8n's own metadata (separate database, shared server)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-agent}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-agent_dev_password}
      # Editor / API
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_BASE_FOR_N8N:-http://localhost:5678/}
      GENERIC_TIMEZONE: UTC
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-change-me}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - agent-network
    restart: unless-stopped

  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:1.79.0
    container_name: agent-n8n-worker
    command: worker
    depends_on:
      n8n-main:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      # The encryption key MUST match n8n-main exactly. n8n docs are explicit:
      # the worker reads credentials from the DB and needs the same key to decrypt.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-in-production-min-32-chars}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-agent}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-agent_dev_password}
      GENERIC_TIMEZONE: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
    networks:
      - agent-network
    restart: unless-stopped

volumes:
  redis_data:
  n8n_data:

# Note: `agent-network` is declared by the root docker-compose.yml as a
# managed bridge. Compose merges top-level network definitions across
# files, so re-declaring here as `external: true` would conflict. The
# services below reference `agent-network` and Compose joins them to
# the root-defined network automatically.
